[project]
name = "causal-genie"
version = "0.1.0"
description = "Research agent for \"does X cause Y?\" questions: sourced DAG, public data, tested estimates."
requires-python = ">=3.11"
dependencies = [
    "dowhy>=0.14",
    "duckdb>=2.0.0",
    "ephem>=4.2.1",
    "graphviz>=0.21",
    "httpx>=0.28.1",
    "networkx>=3.6.1",
    "openai>=3.42.1",
    "pandas>=3.1.0",
    "pydantic>=2.14.2",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "scipy>=1.15.3",
    "statsmodels>=0.15.0",
    "streamlit>=1.66.1",
    "tavily-python>=0.8.5",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "prek>=0.5.9",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "ty>=0.0.95",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*.md"]  # keep ruff out of PRD and notes code blocks

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "BLE", "S110"]  # BLE, S110: no blind or silent excepts (AGENTS.md)

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = ["causal_genie", "tests", "eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m \"not live\""  # live tests: uv run pytest -m live
markers = ["live: calls real APIs; skipped unless keys are set"]
