# Question of the Day (U18): once a day, take the oldest merged pick not yet posted, mark its
# question answered on the board and post it to Bluesky with a link to the run. One post a day
# even when several pick PRs were merged; a backlog drains on nights with no new answer.
#
# Idempotent: only picks whose question is still `running` with that run are published, so a
# re-run never posts twice. A failed post fails this job; the question stays answered.
#
# Setup (once): Actions secrets BOARD_DB_URL, BLUESKY_HANDLE, BLUESKY_APP_PASSWORD; Actions
# variable CG_APP_URL (the Streamlit app's address).
name: Genie publish

on:
  schedule:
    # 02:00 UTC: 6 pm PST / 7 pm PDT (cron is UTC only), evening for US readers. The nightly
    # answer job (10:00 UTC, 2 am PST) opens the pick PR before the morning review; a PR merged
    # that morning posts the same evening, one merged later posts the next day.
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: genie-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Mark answered and post to Bluesky
        env:
          BOARD_DB_URL: ${{ secrets.BOARD_DB_URL }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          CG_APP_URL: ${{ vars.CG_APP_URL }}
        run: uv run python -m causal_genie.ui.bluesky publish
