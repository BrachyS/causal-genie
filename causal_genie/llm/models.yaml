# Token Factory model per tier. Picked 2026-11-02 from a JSON-schema probe of 7 models;
# all returned schema-valid JSON with response_format=json_schema (json_object mode alone did not).
# max_tokens caps one completion, and a reasoning model's thinking counts against it.
tiers:
  small:  # route, extract, map, gate: many calls, short outputs
    model: Qwen/Qwen3-30B-A3B-Instruct-2507  # fastest probe (~1 s), no thinking tokens
    max_tokens: 4000
  large:  # DAG, report: few calls, harder reasoning
    model: deepseek-ai/DeepSeek-V4-Pro-0813  # was DeepSeek-V4-Pro (404 since Nov 12); fallback: moonshotai/Kimi-K3
    # Reasons before answering: 4000 ran out on the DAG prompt with no JSON written (live D4,
    # Nov 13; finish_reason=length, all reasoning_tokens). A one-line question used ~2000.
    max_tokens: 16000

# Prompts whose calls turn reasoning off (chat_template_kwargs thinking=false). report: live D0
# (run 20261114-154259-6bb1d2) spent all 16,000 tokens reasoning and wrote nothing; its prose
# is linted and the verdict is the controller's, so it needs no deep reasoning.
# dag: reasoning length is unbounded (the provider ignores reasoning_effort). Live D5
# (20261114-230639-f286ea) timed out twice at ~600 s; live D3 (20261114-234555-c5e141) spent
# all 16,000 tokens reasoning with no output. Off on 5 recorded DAG inputs: each < 5 s, schema
# valid first time, same structural checks; content differs both ways (T12.5 scores it).
# eval_forbidden (eval judge, large tier): the small tier flipped on live D1's "likely reduces"
# (1 of 2 tries); large with reasoning off flagged nothing wrong in 8 tries, about 1 s each.
# genie_gate (large tier since Nov 14): its sensitive label is the whole humor gate; the small
# tier called a clinical treatment question (licorice gargle before surgery) not sensitive.
no_thinking: [report, dag, eval_forbidden, genie_gate]

# Per-prompt caps overriding the tier's max_tokens. extract: live D0 outputs were 263 tokens
# (median), 651 at most, but one runaway (likely a repetition loop; the small tier does not reason)
# hit 4,000 on a 3,048-character snippet; its schema repair then succeeded.
prompt_max_tokens:
  extract: 1500
